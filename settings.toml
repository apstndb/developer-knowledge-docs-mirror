# settings.toml: Configuration for the Developer Knowledge documentation mirror

# The /knowledge root is an HTTP-only redirect shell and is not present in the
# Developer Knowledge API, so use API-present pages as discovery entry points.
seeds = [
    "https://developers.google.com/knowledge/api",
    "https://developers.google.com/knowledge/quickstart",
    "https://docs.cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge",
]

# Keep the Google Developers corpus and gcloud command reference narrowly scoped.
# The legacy Cloud prefix lets old links recover through their HTTP redirect to
# docs.cloud.google.com without crawling unrelated Cloud documentation.
prefixes = [
    "developers.google.com/knowledge/",
    "docs.cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge/",
    "cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge/",
]

recursive = true
default_host = "developers.google.com"
