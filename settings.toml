# Developer Knowledge API, MCP, and gcloud documentation.
default_host = "developers.google.com"
seeds = [
    "https://developers.google.com/knowledge/api",
    "https://developers.google.com/knowledge/quickstart",
    "https://developers.google.com/knowledge/mcp",
    "https://developers.google.com/knowledge/reference/corpus-reference",
    "https://developers.google.com/knowledge/release-notes",
    "https://docs.cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge",
]
# The bare /knowledge page is not an API document. Host-scoped prefixes also
# exclude the unrelated /knowledge-graph tree. The legacy prefix permits
# redirect recovery when an old gcloud link is discovered or explicitly seeded.
prefixes = [
    "developers.google.com/knowledge/",
    "docs.cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge/",
    "cloud.google.com/sdk/gcloud/reference/alpha/developer-knowledge/",
]
recursive = true
